name: example
description: Example application for the cmdk package.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0 <4.0.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  cmdk:
  cmdk_ui:
  mix: ^2.3.1
  flutter_svg: ^2.3.2
  liquid_glass_renderer:
    git:
      url: https://github.com/definev/flutter_liquid_glass.git
      path: packages/liquid_glass_renderer
  easing_gradient: ^1.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/launcher/

dev_dependencies:
  flutter_test:
    sdk: flutter
